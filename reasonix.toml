# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/AppData/Roaming/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.
config_version = 3
default_model = "deepseek-flash"

[agent]
cold_resume_prune = true

[tools]
bash_timeout_seconds = 120

[tools.background_jobs]
stalled_warning_seconds = 900

[lsp]
enabled = true

[skills]

[permissions]
allow = ["explore", "Edit", "Bash=PY=\"/c/Users/yet/miniconda3/envs/doc-kit/python.exe\"; cd /d/dockit && TMP=$(mktemp -d) && mkdir -p \"$TMP/ProjectSpec\" \"$TMP/SessionSpec/active\" \"$TMP/SessionSpec/archive\" && printf -- \"---\\ndoc_type: business_context\\nmodule: charter\\nlevel: top\\nversion: 0.1.0\\nstatus: active\\n---\\n# 业务背景\\n\\n## 项目动因\\n\\n原始内容\\n\" > \"$TMP/ProjectSpec/business-context.md\" && cd \"$TMP\" && echo \"--- spec status ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py spec status && echo \"--- spec write 创建 ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py spec write --json '{\"session_spec_id\":\"smoke-001\",\"scenario\":\"spec-scribe\",\"status\":\"active\",\"resolutions\":[],\"pending_decisions\":[],\"next_steps\":[]}' && echo \"--- spec read ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py spec read | head -6 && echo \"--- doc read ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py doc read business-context.md | head -14 && echo \"--- doc update-section ---\" && REF=$(cd \"$TMP\" && \"$PY\" /d/dockit/skills/scripts/cli.py doc read business-context.md | \"$PY\" -c \"import json,sys; d=json.load(sys.stdin); print(next(s['reference'] for s in d['data']['sections'] if s['heading']=='项目动因'))\") && \"$PY\" /d/dockit/skills/scripts/cli.py doc update-section \"$REF\" --content \"新内容：辅助决策\" && echo \"--- spec close ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py spec write --json '{\"session_spec_id\":\"smoke-001\",\"scenario\":\"spec-scribe\",\"status\":\"closed\",\"closed_at\":\"2026-01-01T00:00:00Z\",\"closed_reason\":\"冒烟完成\",\"resolutions\":[{\"topic\":\"t\",\"decision\":\"d\",\"detail\":\"详\"*150}],\"pending_decisions\":[],\"next_steps\":[]}' | head -3 && echo \"--- spec archive ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py spec archive && echo \"=== 冒烟全部完成 ===\" && rm -rf \"$TMP\"", "Bash=PY=\"/c/Users/yet/miniconda3/envs/doc-kit/python.exe\"; cd /d/dockit && TMP=$(mktemp -d) && mkdir -p \"$TMP/ProjectSpec\" \"$TMP/SessionSpec/active\" \"$TMP/SessionSpec/archive\" && printf -- \"---\\ndoc_type: business_context\\nmodule: charter\\nlevel: top\\nversion: 0.1.0\\nstatus: active\\n---\\n# 业务背景\\n\\n## 项目动因\\n\\n原始内容\\n\" > \"$TMP/ProjectSpec/business-context.md\" && cd \"$TMP\" && REF=\"ProjectSpec/business-context.md#项目动因\" && echo \"--- doc update-section ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py doc update-section \"$REF\" --content \"新内容：辅助决策\" && echo \"--- 验证文件已更新 ---\" && grep -c \"辅助决策\" ProjectSpec/business-context.md && echo \"--- doc add-section ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py doc add-section \"$REF\" \"新增段落\" --content \"段落内容\" && echo \"--- spec close ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py spec write --json '{\"session_spec_id\":\"smoke-001\",\"scenario\":\"spec-scribe\",\"status\":\"closed\",\"closed_at\":\"2026-01-01T00:00:00Z\",\"closed_reason\":\"冒烟完成\",\"resolutions\":[],\"pending_decisions\":[],\"next_steps\":[]}' && echo \"--- spec archive ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py spec archive && echo \"--- review anchor ---\" && \"$PY\" /d/dockit/skills/scripts/cli.py review anchor-set abc123 && \"$PY\" /d/dockit/skills/scripts/cli.py review anchor-get && echo \"=== 冒烟全部通过 ===\" && rm -rf \"$TMP\""]


[sandbox]
bash    = "off"
network = true

